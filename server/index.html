<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Submit Data</title>
  </head>
  <body>
    <h2>Submit User Data</h2>
    <form id="userForm">
      <input
        type="text"
        id="first_name"
        placeholder="First Name"
        required
      /><br /><br />
      <input
        type="text"
        id="last_name"
        placeholder="Last Name"
        required
      /><br /><br />
      <input
        type="number"
        id="initial_capital"
        placeholder="Initial Capital"
        required
      /><br /><br />
      <input
        type="number"
        id="target_capital"
        placeholder="Target Capital"
        required
      /><br /><br />
      <input
        type="number"
        id="daily_max_loss_limit"
        placeholder="Daily Max Loss Limit"
        required
      /><br /><br />
      <input
        type="number"
        id="working_days_in_month"
        placeholder="Working Days in Month"
        required
      /><br /><br />

      <button type="submit">Submit</button>
    </form>

    <script>
      const API_URL = "https://trade-planner-hmam.onrender.com/api"; // آدرس API بک‌اندت

      document
        .getElementById("userForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const payload = {
            first_name: document.getElementById("first_name").value,
            last_name: document.getElementById("last_name").value,
            initial_capital: document.getElementById("initial_capital").value,
            target_capital: document.getElementById("target_capital").value,
            daily_max_loss_limit: document.getElementById(
              "daily_max_loss_limit"
            ).value,
            working_days_in_month: document.getElementById(
              "working_days_in_month"
            ).value,
          };

          try {
            const res = await fetch(`${API_URL}/save`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            if (res.ok) {
              window.location.href = "api/data"; // بعد از ذخیره میره به صفحه نمایش
            } else {
              alert("Error while saving data");
            }
          } catch (err) {
            alert("Error: " + err);
          }
        });
    </script>
  </body>
</html>
