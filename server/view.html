<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Database Records</title>
  </head>
  <body>
    <h2>Database Records</h2>
    <button onclick="loadData()">Reload Data</button>
    <h3>Calculations</h3>
    <table border="1" cellpadding="8" cellspacing="0" id="calcTable">
      <thead>
        <tr>
          <th>Full Name</th>
          <th>Month Level</th>
          <th>First of Month Cap</th>
          <th>Last of Month Cap</th>
          <th>Profit Per Day</th>
          <th>Profit Per Day Rate</th>
          <th>Profit Per Month</th>
          <th>Profit Per Month Rate</th>
          <th>Max Lot</th>
          <th>Financial Symbol</th>
          <th>Risk Management Pip</th>
          <th>Working Days in Month</th>
          <th>User ID</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script>
      const API_URL = "https://trade-planner-hmam.onrender.com/api"; // آدرس API بک‌اندت

      async function loadData() {
        try {
          const res = await fetch(`${API_URL}/tradePlane/:userId`);
          const data = await res.json();

          const tbody = document.querySelector("#calcTable tbody");
          tbody.innerHTML = "";

          data.forEach((row) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
          
            <td>${row.full_name}</td>
            <td>${row.month_level}</td>
            <td>${row.first_of_month_cap}</td>
            <td>${row.last_of_month_cap}</td>
            <td>${row.profit_per_day}</td>
            <td>${row.profit_per_day_rate}</td>
            <td>${row.profit_per_month}</td>
            <td>${row.profit_per_month_rate}</td>
            <td>${row.max_lot ?? "-"}</td>
            <td>${row.financial_symbol ?? "-"}</td>
            <td>${row.risk_management_pip ?? "-"}</td>
            <td>${row.working_days_in_month}</td>
            <td>${row.user_id}</td>
          `;
            tbody.appendChild(tr);
          });
        } catch (err) {
          alert("Error: " + err);
        }
      }

      // وقتی صفحه باز میشه خودکار دیتا بیاره
      window.onload = loadData;
    </script>
  </body>
</html>
